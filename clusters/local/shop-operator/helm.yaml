---
# ArgoCD Application — shop-operator
# Deploys-uje Kubernetes operator koji upravlja Shop, DiscordChannel i Wallet CRD-ovima.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shop-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: oci://ghcr.io/shophub-platform/helm-charts
    chart: shop-operator
    targetRevision: "0.1.0"
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
