---
# ArgoCD Application — shophub-discord
# Deploy-uje klasterske Discord alarme (PrometheusRule + AlertManager integracija).
# Koristi shop-operator chart ali samo aktivira Discord webhook komponentu.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shophub-discord
  namespace: argocd
spec:
  project: default
  source:
    repoURL: oci://ghcr.io/shophub-platform/helm-charts
    chart: shop-operator
    targetRevision: "0.1.0"
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
