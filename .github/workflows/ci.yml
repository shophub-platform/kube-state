name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  yaml-validate:
    name: Validate YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: yamllint
        run: |
          pip install yamllint >/dev/null
          if compgen -G "clusters/**/*.yaml" > /dev/null || compgen -G "clusters/**/*.yml" > /dev/null; then
            yamllint -d relaxed clusters/
          else
            echo "Još nema manifesta — skeleton prolazi (F0)."
          fi
